; Five processes, one container. Every Tapehouse production concern that
; would otherwise be a separate service in docker-compose.yml (app, nginx,
; reverb, queue, ingest) runs here instead as a supervisord-managed program,
; because this image is built to run as a single unit. All five log to
; stdout/stderr (no file logs, no log rotation config needed) so a container
; platform's own log collection picks everything up without extra wiring;
; that's also why each program's redirect_stderr / stdout_logfile below
; point at /dev/stdout and /dev/fd/2 rather than a path on disk.

[supervisord]
nodaemon=true
; The container already runs as a non-root user (see the Dockerfile's final
; USER directive) — supervisord has nothing to drop privileges from, so
; there is deliberately no `user=` directive here; setting one would only
; matter if supervisord itself had started as root.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:php-fpm]
; -F: stay in the foreground so supervisord can supervise it directly
; instead of tracking a detached daemon's pid.
command=php-fpm -F
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:reverb]
; Binds 127.0.0.1:8081, not the 8080 a naive copy of the dev compose
; command would suggest — nginx already owns this container's one exposed
; port, 8080 (see docker/nginx/prod.conf for the full explanation of why
; those two can't both be 8080 here the way they can when they're separate
; compose services). --host=127.0.0.1 also means Reverb is unreachable
; except through nginx's /app, /apps proxy — nothing else in this
; container needs to reach it directly.
command=php artisan reverb:start --host=127.0.0.1 --port=8081
autorestart=true
startsecs=2
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:queue]
; NOT OPTIONAL. QuotesUpdated and AlertFired are queued ShouldBroadcast
; events on the redis queue connection (see config/queue.php /
; BROADCAST_CONNECTION) — the ingest loop below only ever enqueues a job,
; it never talks to Reverb itself. This worker is the ONLY thing that
; drains that queue and actually delivers a frame to Reverb for the
; browser to receive. Delete this program "to simplify the five down to
; four" and nothing errors anywhere: php-fpm serves pages, nginx proxies
; fine, Reverb reports a healthy socket, ingest keeps logging ticks,
; migrations still ran — but every open tape freezes at its last price and
; queue_depth on the ops panel climbs without bound, because no frame ever
; leaves the queue. There is no log line or exception for "nobody is
; listening"; the only symptom is a browser tab that quietly stops moving.
; --tries=3 lets a transient Reverb publish failure retry instead of
; dropping the frame outright; --max-time=3600 recycles the worker hourly
; so a slow memory leak in a long broadcast loop can't accumulate forever
; (autorestart=true immediately starts a fresh one when it exits clean).
command=php artisan queue:work --tries=3 --max-time=3600
autorestart=true
startsecs=2
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40

[program:ingest]
; Requires ext-pcntl (installed in the Dockerfile's runtime stage): this
; command installs SIGTERM/SIGINT handlers on its ReactPHP loop so
; `docker stop` / supervisord's own shutdown can end the ingest loop
; gracefully instead of forcing a SIGKILL after the container platform's
; grace period expires.
command=php artisan tape:ingest
autorestart=true
startsecs=2
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=50

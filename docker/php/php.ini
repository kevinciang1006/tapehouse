; Development settings for every Tapehouse PHP-FPM service (app, reverb,
; queue, ingest all load this same file — see docker-compose.yml). Task 3's
; production image should NOT reuse this file verbatim: it wants
; display_errors=Off and opcache.validate_timestamps=0 at minimum.

[PHP]
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr

memory_limit = 512M
; CLI SAPI (reverb:start, queue:work, tape:ingest) already ignores this and
; runs unbounded; this only matters for FPM-served HTTP requests.
max_execution_time = 60
max_input_time = 60

upload_max_filesize = 20M
post_max_size = 20M

date.timezone = UTC

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; The source tree is bind-mounted (see docker-compose.yml) specifically so a
; host-side edit is picked up without a rebuild. validate_timestamps=1 (the
; default, set explicitly here so it survives a copy-paste into a profile
; that turns it off) makes opcache recheck the mtime on every request rather
; than serving a stale compiled copy until the process restarts.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

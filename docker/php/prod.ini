; Production settings, baked into the tapehouse:local image by the root
; Dockerfile. Mirrors docker/php/php.ini (Task 2's dev pool config) apart
; from the two changes that file's own header comment calls out — display
; errors off, and opcache trusting the compiled-in source instead of
; re-stat'ing it on every request — since this image copies the source in
; at build time rather than bind-mounting it live.

[PHP]
; A stack trace in the HTTP response body is a dev convenience, not a
; production one; Laravel's own error handler still logs the full trace to
; storage/logs (or stderr — see LOG_CHANNEL) regardless of this setting.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr

memory_limit = 512M
; CLI SAPI (reverb:start, queue:work, tape:ingest) already ignores this and
; runs unbounded; this only matters for FPM-served HTTP requests.
max_execution_time = 60
max_input_time = 60

upload_max_filesize = 20M
post_max_size = 20M

date.timezone = UTC

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; The opposite choice from docker/php/php.ini, deliberately: this image
; COPYs the source in at build time and never mounts it live, so nothing
; on disk changes between container start and stop. Checking every file's
; mtime on every request (the dev default) would just be wasted syscalls
; here; validate_timestamps=0 skips that check and serves whatever opcache
; compiled at first request forever, which is correct because a code
; change means a new image, not a live edit.
opcache.validate_timestamps = 0

# Development nginx vhost: serves public/ directly and proxies PHP to the
# `app` service's php-fpm pool over the compose network. Task 3's production
# image is expected to bring its own, hardened server block (TLS, gzip
# tuning, cache headers for /build) — this one favours legibility.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Laravel never serves dotfiles; deny them outright rather than let a
    # stray .env or .git slip through try_files.
    location ~ /\. {
        deny all;
    }
}

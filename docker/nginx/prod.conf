# Production nginx vhost, baked into the tapehouse:local image by the root
# Dockerfile (COPYed to /etc/nginx/http.d/default.conf). This is deliberately
# a *separate* file from docker/nginx/default.conf, which stays exactly as
# Task 2 left it: that file is bind-mounted straight into the `nginx` service
# in docker-compose.yml for local dev and proxies PHP to a *different*
# container (`app:9000`) over the compose network. This file proxies to
# 127.0.0.1:9000 because php-fpm, nginx, Reverb, the queue worker and the
# ingest loop all run as sibling processes inside ONE container here,
# supervised by supervisord — see docker/supervisor/supervisord.conf.
#
# Listens on 8080 (not 80) so the whole image, including nginx's master
# process, can run as a non-root user: binding a port below 1024 needs
# CAP_NET_BIND_SERVICE / root, and this build intentionally has neither.
# 8080 is also the ONE port this image exposes and the port the container
# verification maps host traffic onto — nginx has to be what answers it.
server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    # nginx's default access/error log paths (/var/log/nginx/*.log) require
    # a writable /var/log/nginx; symlinking them to the standard streams in
    # the Dockerfile (ln -sf /dev/stdout .../access.log, etc.) means this
    # block doesn't need its own access_log/error_log directives — a
    # container platform tailing stdout/stderr already sees everything.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Reverb's WebSocket endpoint, reverse-proxied through the same origin
    # the console's JS was served from rather than exposing Reverb
    # separately. Laravel Echo's Reverb connector hits paths under /app
    # (the socket handshake) and /apps (the HTTP broadcast API); both need
    # to land on the Reverb process.
    #
    # Reverb binds 127.0.0.1:8081, NOT 8080, even though the brief's sample
    # config and the naive `reverb:start --host=0.0.0.0 --port=8080` both
    # say 8080: in the dev compose stack that's fine because nginx and
    # Reverb are separate containers with separate network namespaces, but
    # here they are sibling processes sharing ONE namespace under
    # supervisord, and nginx already owns 8080 (the one port this image
    # exposes — see above). Two processes cannot both bind 0.0.0.0:8080 in
    # the same container; `docker build` would succeed regardless, and
    # this would only surface at runtime as Reverb FATAL-looping in
    # `supervisorctl status`, port already in use, with php-fpm/nginx/queue
    # /ingest all reporting healthy — a much harder defect to find than
    # this comment. 8081 is purely an internal wiring detail between nginx
    # and Reverb; it is unrelated to REVERB_PORT (the env var that tells a
    # browser or the queue worker's publisher what port to *dial*, which
    # for a browser going through this proxy is nginx's 8080).
    #
    # Upgrade/Connection are what turn this into a WebSocket proxy rather
    # than a plain HTTP one — omit them and the client's Upgrade handshake
    # gets a normal HTTP response back, the JS socket never opens, and
    # nothing about that failure is visible anywhere except the tape never
    # moving. proxy_read_timeout is set far above nginx's 60s default
    # because a healthy Reverb connection is meant to sit open indefinitely
    # between frames, not time out.
    location ~ ^/(app|apps) {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Laravel never serves dotfiles; deny them outright rather than let a
    # stray .env or .git slip through try_files.
    location ~ /\. {
        deny all;
    }
}
